<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>두 번째 미션</title>
  <style>
    body {
      font-family: 'Arial';
      background: #eaf7ff;
      text-align: center;
      padding-top: 100px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      color: blue;
    }
  </style>
</head>
<body>
  <h1>🎁 두 번째 미션 🎁</h1>
  <p>내가 너를 처음 좋아하게 된 이유는?</p>
  <input type="text" id="answer2" placeholder="정답 입력...">
  <button onclick="checkAnswer2()">확인</button>
  <div id="result"></div>

  <script>
    function checkAnswer2() {
      const userAnswer = document.getElementById("answer2").value.trim();
      const correct = "눈웃음"; // 원하는 답으로 바꿔도 돼!
      if (userAnswer === correct) {
        document.getElementById("result").innerHTML = "정답이야! 마지막으로 가자! 👉 <a href='final.html'>Go!</a>";
      } else {
        document.getElementById("result").innerText = "살짝 힌트 줄까...? 😉";
      }
    }
  </script>
</body>
</html>
