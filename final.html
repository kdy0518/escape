<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>너를 위한 편지</title>
  <style>
    body {
      background: #fff0f5;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 100px 20px;
    }
    h1 {
      font-size: 36px;
      color: #e91e63;
    }
    p {
      font-size: 20px;
      line-height: 1.6;
      max-width: 600px;
      margin: 20px auto;
    }
    .heart {
      font-size: 60px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="heart">❤️</div>
  <h1>수고했어, 사랑하는 너에게</h1>
  <p>
    지금까지 온 거 자체로도 대단해. <br>
    사실 이건 다 너를 위해 준비한 작은 이벤트였어. <br>
    너랑 함께한 모든 순간이 소중해. <br>
    앞으로도 우리, 지금처럼만 함께하자 💕
  </p>
  <p>- 도윤이가 -</p>
</body>
</html>
